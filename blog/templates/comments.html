<!DOCTYPE html>
<html>

<head>

<title>Comments</title>

<style>

body{
font-family:Arial;
background:#e6f2e6;
padding:40px;
}

.container{
background:white;
padding:20px;
border-radius:10px;
width:600px;
margin:auto;
}

.comment{
border-bottom:1px solid #ddd;
padding:10px 0;
}

textarea{
width:100%;
height:70px;
margin-top:10px;
}

button{
margin-top:10px;
padding:6px 14px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Comments</h2>

{% for comment in comments %}

<div class="comment">

<strong>{{comment.user.username}}</strong><br>
{{comment.text}}

</div>

{% empty %}

<p>No comments yet</p>

{% endfor %}

<form method="POST" action="/comment/{{ blog.id }}/">

{% csrf_token %}

<input type="text" name="text" placeholder="Write comment">

<button type="submit">Post</button>

</form>

</div>

</body>

</html>
