<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ blog.title }}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 28px;
        }
        .meta {
            color: #7f8c8d;
            font-size: 14px;
            margin: 20px 0;
            padding: 10px 0;
            border-bottom: 1px dashed #bdc3c7;
        }
        .meta p {
            margin: 5px 0;
        }
        .content {
            margin: 30px 0;
            font-size: 14px;
        }
        .mood-tag {
            display: inline-block;
            padding: 5px 15px;
            background: #3498db;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .footer {
            margin-top: 50px;
            font-size: 11px;
            color: #95a5a6;
            text-align: center;
            border-top: 1px solid #ecf0f1;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <h1>{{ blog.title }}</h1>
    
    <div class="meta">
        <p><strong>Author:</strong> {% if blog.anonymous %}Anonymous{% else %}{{ blog.author }}{% endif %}</p>
        <p><strong>Published:</strong> {{ blog.created_at|date:"F j, Y" }}</p>
        <p><strong>Reading time:</strong> {{ blog.reading_time }} min</p>
        <span class="mood-tag">Mood: {{ blog.mood }}</span>
    </div>

    <div class="content">
        {{ blog.content|safe }}
    </div>

    <div class="footer">
        Generated from MoodBlog - {{ request.build_absolute_uri }}
    </div>
</body>
</html>
