<!DOCTYPE html>
<html>

<head>
<title>Signup</title>
<link rel="stylesheet" href="/static/main.css">
</head>

<body>

{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container">
    <div class="topbar">
        <h2>Sign Up</h2>
        <div class="nav">
            <a href="/">⬅ Back to Home</a>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>

    <br>
    <div class="glass-card" style="text-align: center; padding: 15px;">
        <p style="margin: 0;">Already have an account? <a href="/login/" style="color: white; font-weight: bold; text-decoration: underline;">Login here</a></p>
    </div>
</div>
{% endblock %}
</body>
</html>
